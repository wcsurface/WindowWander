<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Road Trip Bingo - Mobile Casual Game</title>
  <meta name="description" content="A modern, addictive, social road trip game for passengers. Play local or online multiplayer bingo across America!">
  <meta name="theme-color" content="#0284C7">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=39">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div id="app">
    <!-- MAIN CONTAINER -->
    <main id="main-content">
      <!-- Dynamic content rendered by app.js -->
    </main>

    <!-- FLOATING 3D GRADIENT PILL NAVIGATION BAR (SET 6) -->
    <footer class="app-footer">
      <button id="nav-home" class="active" onclick="router.navigate('home')">🏠 Home</button>
      <button id="nav-login" onclick="router.navigate('login')"><span id="nav-login-label">🔑 Log In</span></button>
      <button id="nav-shop" onclick="router.navigate('shop')">🏪 Shop</button>
      <button id="nav-settings" onclick="router.navigate('settings')">⚙️ Settings</button>
    </footer>
  </div>

  <script src="app.js?v=39"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=39').catch(err => console.log('SW Registration failed:', err));
      });
    }
  </script>
</body>
</html>
