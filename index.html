<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Road Trip Bingo - Mobile Casual Game</title>
  <meta name="description" content="A modern, addictive, social road trip game for passengers. Play local or online multiplayer bingo across America!">
  <meta name="theme-color" content="#0284C7">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=71">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div id="app">
    <!-- MAIN CONTAINER -->
    <main id="main-content">
      <!-- Dynamic content rendered by app.js -->
    </main>

    <!-- FLOATING 3D GRADIENT PILL NAVIGATION BAR (SET 6) -->
    <footer class="app-footer">
      <button id="nav-home" class="active" onclick="router.navigate('home')">
        <span class="nav-icon-wrapper active"><img src="nav_home_icon.png" alt="Home" class="nav-icon-img nav-car-icon" /></span>
        <span>Home</span>
      </button>
      <button id="nav-login" onclick="router.navigate('login')">
        <span class="nav-icon-wrapper"><img src="nav_login_icon.png" alt="Log In" class="nav-icon-img" /></span>
        <span id="nav-login-label">Log In</span>
      </button>
      <button id="nav-shop" onclick="router.navigate('shop')">
        <span class="nav-icon-wrapper"><img src="nav_shop_icon.png" alt="Shop" class="nav-icon-img" /></span>
        <span>Shop</span>
      </button>
      <button id="nav-settings" onclick="router.navigate('settings')">
        <span class="nav-icon-wrapper"><img src="nav_settings_icon.png" alt="Settings" class="nav-icon-img" /></span>
        <span>Settings</span>
      </button>
    </footer>
  </div>

  <script src="app.js?v=71"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=71').catch(err => console.log('SW Registration failed:', err));
      });
    }
  </script>
</body>
</html>
